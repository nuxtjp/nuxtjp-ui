name: Watch primary sources

on:
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Detect upstream changes without updating files
        id: detect
        shell: bash
        run: |
          set +e
          node scripts/check-upstream.mjs > upstream-report.json
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo '## Primary-source review'
            echo
            echo 'This workflow only detects changes. It never updates the lock or implementation.'
            echo
            echo '```json'
            cat upstream-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require review for a change or unavailable source
        if: steps.detect.outputs.result != '0'
        run: |
          echo "Primary-source review required (exit ${{ steps.detect.outputs.result }})."
          exit 1
