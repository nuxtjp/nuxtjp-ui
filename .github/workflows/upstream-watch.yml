name: Watch primary sources

on:
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Detect upstream changes without updating files
        id: detect
        shell: bash
        run: |
          set +e
          node scripts/check-upstream.mjs > upstream-report.json
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo '## Primary-source review'
            echo
            echo 'This workflow only detects changes. It never updates the lock or implementation.'
            echo
            echo '```json'
            cat upstream-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require review for a change or unavailable source
        if: steps.detect.outputs.result != '0'
        run: |
          echo "Primary-source review required (exit ${{ steps.detect.outputs.result }})."
          exit 1
