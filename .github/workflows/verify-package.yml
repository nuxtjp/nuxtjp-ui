name: Verify public npm package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve archive names from current package manifests
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/archive_names.py"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.29.3
      - name: Install reviewed lockfile and backports
        run: pnpm install --frozen-lockfile
      - name: Generate Nuxt playground types
        run: pnpm exec nuxt prepare playground
      - name: Test APIs and dependency regression cases
        run: pnpm test
      - name: Test consolidated Vue packages
        run: pnpm --filter './packages/*' run test
      - name: Check types
        run: pnpm typecheck
      - name: Build module and playground
        run: pnpm build
      - name: Build consolidated Vue packages
        run: pnpm --filter './packages/*' run build
      - name: Check consolidated Vue package types
        run: pnpm --filter './packages/*' run typecheck
      - name: Inspect actual archive inputs
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consolidated-packages"
          cp "$RUNNER_TEMP/${PACKAGE_ARCHIVE_NUXTJP_UI_NPM}" "$RUNNER_TEMP/consolidated-packages/"
          for package in nuxt-managed-resources nuxt-operations-console nuxt-management-layout nuxt-dependency-security; do
            (cd "packages/$package" && npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/consolidated-packages")
          done
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/consolidated-packages/source-sha.txt"
          (cd "$RUNNER_TEMP/consolidated-packages" && sha256sum ./*.tgz > SHA256SUMS)
      - name: Retain consolidated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-npm-packages
          path: ${{ runner.temp }}/consolidated-packages/
          if-no-files-found: error
          retention-days: 3
      - name: Retain reviewed distribution archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 3
      - name: Verify backports in a fresh packed consumer
        run: node .github/scripts/package-consumer-security.mjs "$RUNNER_TEMP/${PACKAGE_ARCHIVE_NUXTJP_UI_NPM}" @nuxtjp/ui "$RUNNER_TEMP/consolidated-packages/${PACKAGE_ARCHIVE_NUXTJP_DEPENDENCY_SECURITY_NPM}"
