name: Verify repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve archive names from current package manifests
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/archive_names.py"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify compliance graph
        run: node scripts/verify-compliance.mjs

      - name: Prepare Nuxt types
        run: pnpm exec nuxt prepare playground

      - name: Run tests
        run: pnpm run test

      - name: Type-check package and playground
        run: pnpm run typecheck

      - name: Build package playground
        run: pnpm run build

      - name: Pack with the existing prepack gates
        run: |
          mkdir -p "$RUNNER_TEMP/ui-package"
          pnpm pack --pack-destination "$RUNNER_TEMP/ui-package"
          (cd packages/nuxt-dependency-security && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/ui-package")

      - name: Check the actual archive
        run: python3 .github/scripts/check-package.py "$RUNNER_TEMP/ui-package/${PACKAGE_ARCHIVE_NUXTJP_UI_NPM}"

      - name: Verify an independent archive consumer
        run: node .github/scripts/package-consumer.mts "$RUNNER_TEMP/ui-package/${PACKAGE_ARCHIVE_NUXTJP_UI_NPM}" npm "$RUNNER_TEMP/ui-package/${PACKAGE_ARCHIVE_NUXTJP_DEPENDENCY_SECURITY_NPM}"

      - name: Verify a pnpm archive consumer
        run: node .github/scripts/package-consumer.mts "$RUNNER_TEMP/ui-package/${PACKAGE_ARCHIVE_NUXTJP_UI_NPM}" pnpm "$RUNNER_TEMP/ui-package/${PACKAGE_ARCHIVE_NUXTJP_DEPENDENCY_SECURITY_NPM}"
