name: Verify repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify compliance graph
        run: node scripts/verify-compliance.mjs

      - name: Prepare Nuxt types
        run: pnpm exec nuxt prepare playground

      - name: Run tests
        run: pnpm run test

      - name: Type-check package and playground
        run: pnpm run typecheck

      - name: Build package playground
        run: pnpm run build

      - name: Pack with the existing prepack gates
        run: |
          mkdir -p "$RUNNER_TEMP/ui-package"
          pnpm pack --pack-destination "$RUNNER_TEMP/ui-package"

      - name: Check the actual archive
        run: python3 .github/scripts/check-package.py "$RUNNER_TEMP/ui-package/nuxtjp-ui-0.1.2.tgz"

      - name: Verify an independent archive consumer
        run: node .github/scripts/package-consumer.mjs "$RUNNER_TEMP/ui-package/nuxtjp-ui-0.1.2.tgz"

      - name: Verify a pnpm archive consumer
        run: node .github/scripts/package-consumer.mjs "$RUNNER_TEMP/ui-package/nuxtjp-ui-0.1.2.tgz" pnpm
